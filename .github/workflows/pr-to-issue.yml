name: PR to Issue

on:
  pull_request:
    types: [labeled]

permissions: read-all

jobs:
  document:
    name: Generate issue from pull request
    if: github.event.label.name == 'auto-document'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Pinned for reproducibility: an unpinned install would silently pick up
      # whatever version is current when the workflow runs.
      - name: Install dependencies
        run: pip install --no-cache-dir -r tools/requirements.txt

      - name: Run PR documentation
        run: python process_pr.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ALLOWED_USER: ${{ secrets.ALLOWED_USER }}
