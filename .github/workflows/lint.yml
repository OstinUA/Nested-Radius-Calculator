name: Lint and Static Checks

on:
  pull_request:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Frontend and tooling checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # The site is dependency-free, so no install step is required. Every
      # shipped module is syntax-checked; the glob covers the application
      # modules, the localization runtime and all locale dictionaries.
      - name: Validate JavaScript syntax
        run: |
          shopt -s globstar nullglob
          files=(script.js radius.mjs i18n/**/*.mjs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No JavaScript modules found."
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done
          echo "Checked ${#files[@]} module(s)."

      # Parses every dictionary and compares the key set with the reference
      # locale, catching missing or misspelled keys before they reach the UI.
      - name: Validate translation dictionaries
        run: node --input-type=module -e "import('./i18n/index.mjs');"

      - name: Validate Python syntax
        run: |
          python3 -m compileall -q process_pr.py "trigger action"
