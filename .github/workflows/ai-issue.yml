name: Llama Auto-Issue Generator

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, labeled]

permissions: read-all

concurrency:
  group: ai-issue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze change set
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Pinned for reproducibility: an unpinned install would silently pick up
      # whatever version is current when the workflow runs.
      - name: Install dependencies
        run: pip install --no-cache-dir -r tools/requirements.txt

      - name: Run analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          ALLOWED_USER: ${{ secrets.ALLOWED_USER }}
        run: python "trigger action/trigger_action.py"
